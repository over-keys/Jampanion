<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#173f3a" />
    <meta name="description" content="Jampanion adaptive jazz backing partner" />
    <base href="/" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/app.css" />
    <title>Jampanion</title>
</head>
<body>
    <div id="app">
        <div class="boot-screen">
            <strong>Jampanion</strong>
            <span>Loading the web app…</span>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unexpected error occurred.
        <a href="." class="reload">Reload</a>
        <button class="dismiss" type="button">×</button>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js"));
        }
    </script>
</body>
</html>
