name: Deploy Jampanion Web to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'scripts/verify-pages-smoke.sh'
      - 'src/Jampanion.Core/**'
      - 'src/Jampanion.Web/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify bundled web SoundFont
        shell: bash
        run: |
          set -euo pipefail
          soundfont='src/Jampanion.Web/wwwroot/soundfonts/FluidR3_Jampanion.sf3'
          expected='2e4aa17f20743930c87ada7cc1fee2228ecd2bb0e2de75a83cd590c53bcd0d63'
          test -s "$soundfont"
          actual="$(sha256sum "$soundfont" | cut -d' ' -f1)"
          test "$actual" = "$expected"
          printf 'SoundFont: %s\nSHA-256: %s\n' "$soundfont" "$actual"
          ls -lh "$soundfont"

      - name: Build browser audio assets
        working-directory: src/Jampanion.Web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publish Blazor WebAssembly app
        run: |
          dotnet publish src/Jampanion.Web/Jampanion.Web.csproj \
            -c Release \
            -o artifacts/jampanion-web

      - name: Prepare GitHub Pages base path
        shell: bash
        run: |
          set -euo pipefail
          site=artifacts/jampanion-web/wwwroot
          repository_name="${GITHUB_REPOSITORY#*/}"
          sed -i "s#<base href=\"/\" />#<base href=\"/${repository_name}/\" />#" "$site/index.html"
          cp "$site/index.html" "$site/404.html"
          mkdir -p "$site/app"
          cp "$site/index.html" "$site/app/index.html"
          touch "$site/.nojekyll"

      - name: Verify published app in Chrome
        shell: bash
        run: |
          chmod +x scripts/verify-pages-smoke.sh
          scripts/verify-pages-smoke.sh \
            artifacts/jampanion-web/wwwroot \
            "${GITHUB_REPOSITORY#*/}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/jampanion-web/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
