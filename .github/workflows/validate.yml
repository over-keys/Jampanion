name: Validate

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-regression-checks:
    runs-on: ubuntu-latest
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify tagged version metadata
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          grep -Fq "<Version>${version}</Version>" src/Jampanion/Jampanion.csproj
          grep -Fq "<AssemblyVersion>${version}.0</AssemblyVersion>" src/Jampanion/Jampanion.csproj
          grep -Fq "<FileVersion>${version}.0</FileVersion>" src/Jampanion/Jampanion.csproj
          grep -Fq "<InformationalVersion>${version}</InformationalVersion>" src/Jampanion/Jampanion.csproj
          grep -Fq "公開版 v${version}" Jampanion_日本語説明書.md

      - name: Restore
        run: |
          dotnet restore Jampanion.sln -p:UsedAvaloniaProducts=
          dotnet restore tests/Jampanion.Core.RegressionChecks/Jampanion.Core.RegressionChecks.csproj

      - name: Build
        run: dotnet build Jampanion.sln -c Release --no-restore -p:UsedAvaloniaProducts=

      - name: Run regression checks
        run: >-
          dotnet run
          --project tests/Jampanion.Core.RegressionChecks/Jampanion.Core.RegressionChecks.csproj
          -c Release
          --no-restore
